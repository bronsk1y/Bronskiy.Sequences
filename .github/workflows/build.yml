name: Publish NuGet & Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  SOLUTION: Bronskiy.Sequences.sln                          # путь к .sln (если есть)
  PROJECT: src/Bronskiy.Sequences/Bronskiy.Sequences.csproj # путь к проекту для pack

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - show files
        run: find . -name "*.csproj" -o -name "*.sln"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.PROJECT }}
          -c Release --no-build -o ./nupkgs
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: Bronsk1y

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
