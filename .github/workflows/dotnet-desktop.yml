name: Publish NuGet & Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write 
  id-token: write 

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build & Test
        run: dotnet test -c Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack Bronskiy.Sequences.csproj -c Release -o ./nupkgs -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: Bronsk1y

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/my-sdk.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.nupkg

